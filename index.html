<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Battery Fitment Finder</title>
<style>:root{--bg:#f4f5f7;--card:#fff;--ink:#15202b;--muted:#5d6b7a;--line:#dfe3e8;--brand:#0f2a43;--accent:#e8a200;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e8edf2;--muted:#9aa8b6;--line:#2b3947;--brand:#09131d;--accent:#f0b429;--err:#ff8a80}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:340px;text-align:center}
.bolt{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--accent);color:#3a2a00;font-size:26px}
h1{font-size:20px;margin:10px 0 4px}p{color:var(--muted);margin:0 0 14px;font-size:14px}
input[type=password]{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
label{display:block;margin-top:10px;font-size:13px;color:var(--muted)}#err{color:var(--err);min-height:20px;margin-top:8px;font-size:14px}</style></head><body>
<form class="box" id="f"><div class="bolt">⚡</div><h1>Battery Fitment Finder</h1><p>Staff only. Enter the password.</p>

<button type="submit" id="go">Open</button><div id="err" role="alert"></div></form>

function b(x){var s=atob(x),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function open(pw){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.s),iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.i)},key,b(E.d));return new TextDecoder().decode(p)}
async function go(pw,remember){var err=document.getElementById('err'),btn=document.getElementById('go');err.textContent='';btn.disabled=true;btn.textContent='Opening…';
 try{var html=await open(pw);if(remember){try{localStorage.setItem('bff_pw',pw)}catch(e){}}document.open();document.write(html);document.close()}
 catch(e){try{localStorage.removeItem('bff_pw')}catch(x){}err.textContent=(window.crypto&&crypto.subtle)?'Wrong password.':'This browser can’t open the page. Try Chrome, Edge, Safari or Firefox.';btn.disabled=false;btn.textContent='Open'}}
